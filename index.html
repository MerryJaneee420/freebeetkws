<script>

const winners = [

["PAN***88","20.000"],
["JOK***12","25.000"],
["BOS***99","50.000"],
["SUL***45","75.000"],
["AND***77","100.000"],
["VIP***11","20.000"],
["MAX***66","25.000"],
["PRO***09","50.000"],
["WIN***88","75.000"],
["TOP***21","100.000"],
["LUC***55","20.000"],
["DER***77","50.000"],
["4DE***00","75.000"],
["KIN***22","100.000"]
["MIK***73","20.000"],
["LEO***25","25.000"],
["KEN***80","50.000"],
["RIO***14","75.000"],
["BAG***69","100.000"],
["NIC***33","20.000"],
["EKA***58","25.000"],
["TOM***92","50.000"],
["DAV***47","75.000"],
["CHA***11","100.000"]
];

function renderWinners(){

let html = "";

const shuffled =
[...winners].sort(()=>0.5-Math.random());

const selected =
shuffled.slice(0,5);

selected.forEach(item=>{

html += `
<div class="winner-item">
<span>${item[0]}</span>
<span class="winner-amount">
Rp ${item[1]}
</span>
</div>
`;

});

document.getElementById("winnerFeed").innerHTML = html;

}

renderWinners();

setInterval(renderWinners,5000);

</script>
<script>

const hadiah = [
  { nominal: 20000, label: "VOUCHER" },
  { nominal: 25000, label: "VOUCHER" },
  { nominal: 50000, label: "VOUCHER" },
  { nominal: 75000, label: "VOUCHER" },
  { nominal: 100000, label: "VOUCHER" }
];

let isSpinning=false;

window.addEventListener("load",()=>{

if(localStorage.getItem("voucher_claimed")){

const btn=document.querySelector(".spin-btn");

btn.innerHTML="SUDAH CLAIM";
btn.disabled=true;
btn.style.opacity=".5";
btn.style.cursor="not-allowed";

}

});

function spinSlot(){

if(isSpinning) return;

if(localStorage.getItem("voucher_claimed")){
alert("❌ Voucher sudah pernah di-claim!");
return;
}

const user=document.getElementById("username").value;

if(user==""){
alert("Masukkan Username terlebih dahulu!");
return;
}

isSpinning=true;

const reel=document.getElementById("reel");
const btn=document.querySelector(".spin-btn");

btn.innerHTML="MEMPROSES...";
btn.disabled=true;

let speed=50;
let count=0;

function rollingEffect(){

const temp=
hadiah[Math.floor(Math.random()*hadiah.length)];

reel.innerHTML=
"Rp "+temp.nominal.toLocaleString("id-ID");

count++;

if(count<45){

if(count>25){
speed+=12;
}

setTimeout(rollingEffect,speed);

}else{

const result=
hadiah[Math.floor(Math.random()*hadiah.length)];

reel.innerHTML=
"Rp "+result.nominal.toLocaleString("id-ID");

document.getElementById("winType").innerHTML=
" FREEBET KAMU ";

document.getElementById("popupAmount").innerHTML=
"Rp "+result.nominal.toLocaleString("id-ID");

document.getElementById("popupUser").innerHTML=
"🎊 Selamat <b>"+user+
"</b><br><br>SCREENSHOT VOUCHER INI DAN KIRIM KE ADMIN UNTUK CLAIM HADIAH.";

document.getElementById("popup").style.display=
"flex";

localStorage.setItem("voucher_claimed","true");

btn.innerHTML="SUDAH CLAIM";
btn.disabled=true;
btn.style.opacity=".5";
btn.style.cursor="not-allowed";

isSpinning=false;

if(typeof confetti!=="undefined"){

confetti({
particleCount:400,
spread:180,
origin:{y:0.6}
});

setTimeout(()=>{
confetti({
particleCount:250,
spread:120,
origin:{x:0}
});
},300);

setTimeout(()=>{
confetti({
particleCount:250,
spread:120,
origin:{x:1}
});
},300);

}

}

}

rollingEffect();

}

function closePopup(){
document.getElementById("popup").style.display="none";
}

</script>
<script>
function fitReelText(){
    const reel = document.querySelector('.reel');

    let size = 150; /* Perbesar dari 50 menjadi 70 */

    reel.style.fontSize = size + 'px';

    while(reel.scrollWidth > reel.clientWidth - 20 && size > 30){
        size--;
        reel.style.fontSize = size + 'px';
    }
}

window.addEventListener('load', fitReelText);
window.addEventListener('resize', fitReelText);
</script>
